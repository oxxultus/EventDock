plugins {
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

group = 'io.github.oxxultus'
version = '0.1.0-SNAPSHOT'

subprojects {
    group = rootProject.group
    version = rootProject.version

    plugins.withId('java-library') {
        apply plugin: 'maven-publish'
        apply plugin: 'signing'

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
            withSourcesJar()
            withJavadocJar()
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java
                    pom {
                        name = project.name
                        description = 'Framework-independent transactional outbox and idempotent inbox toolkit'
                        url = 'https://github.com/oxxultus/EventDock'
                        licenses {
                            license {
                                name = 'MIT License'
                                url = 'https://opensource.org/licenses/MIT'
                                distribution = 'repo'
                            }
                        }
                        developers {
                            developer {
                                id = 'oxxultus'
                                name = 'oxxultus'
                                url = 'https://github.com/oxxultus'
                            }
                        }
                        scm {
                            connection = 'scm:git:https://github.com/oxxultus/EventDock.git'
                            developerConnection = 'scm:git:ssh://git@github.com/oxxultus/EventDock.git'
                            url = 'https://github.com/oxxultus/EventDock'
                        }
                    }
                }
            }
        }

        signing {
            def signingKey = findProperty('signingKey')
            def signingPassword = findProperty('signingPassword')
            if (signingKey) {
                useInMemoryPgpKeys(signingKey, signingPassword)
                sign publishing.publications.mavenJava
            }
        }
    }
}
