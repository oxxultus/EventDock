project:
  name: EventDock
  description: Framework-independent transactional outbox and idempotent inbox toolkit
  authors:
    - oxxultus
  license: MIT
  links:
    homepage: https://github.com/oxxultus/EventDock
  languages:
    java:
      groupId: io.github.oxxultus
      version: 21

release:
  github:
    enabled: false
    owner: oxxultus
    name: EventDock

deploy:
  maven:
    mavenCentral:
      eventdock:
        active: RELEASE
        url: https://central.sonatype.com/api/v1/publisher
        namespace: io.github.oxxultus
        sign: false
        stagingRepositories:
          - build/staging-deploy
